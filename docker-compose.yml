version: '3.8'

services:
  # ==========================================================
  # 1. Frontend Web Container (Nginx)
  # ==========================================================
  frontend:
    image: nginx:alpine
    container_name: task-frontend
    restart: unless-stopped
    ports:
      - "80:80"       # Standard HTTP access
      - "3000:80"     # Alternate port for systems without root port 80 access
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - task-network

  # ==========================================================
  # 2. Backend REST API Container (Node.js + Express)
  # ==========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-backend
    restart: unless-stopped
    ports:
      - "5001:5000"   # Mapped to 5001 to prevent macOS AirPlay port 5000 conflict
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: taskuser
      DB_PASSWORD: taskpassword
      DB_NAME: taskdb
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - task-network

  # ==========================================================
  # 3. Database Container (MySQL 8.0)
  # ==========================================================
  mysql:
    image: mysql:8.0
    container_name: task-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: taskdb
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "taskuser", "-ptaskpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - task-network

# ==========================================================
# Isolated Bridge Network & Persistent Volumes
# ==========================================================
networks:
  task-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
