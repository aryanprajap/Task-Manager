name: Task Management System CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================================
  # Stage 1: Continuous Integration - Automated Testing
  # ==========================================================
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Execute Health & Unit Tests
        working-directory: ./backend
        run: npm test

  # ==========================================================
  # Stage 2: Continuous Integration - Docker Image Build
  # ==========================================================
  build-docker:
    name: Build & Verify Docker Images
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ github.repository }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Docker Compose Configuration
        run: docker compose config

  # ==========================================================
  # Stage 3: Continuous Deployment (Simulated / Cloud Deployment)
  # ==========================================================
  deploy:
    name: Deploy to Cloud Server / Staging
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Simulated Deployment
        run: |
          echo "🚀 Simulating Deployment to AWS EC2 / Production Docker Host..."
          echo "✅ Pulling latest Docker image from registry"
          echo "✅ Executing 'docker compose up -d --remove-orphans'"
          echo "🎉 System successfully deployed and running!"
