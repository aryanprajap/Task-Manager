<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Task Manager - Student Project for Cloud & DevOps">
  <title>Task Manager</title>
  
  <!-- System & Inter Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

  <div class="app-layout">
    
    <!-- Left Navigation Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-avatar">
            <i class="fa-solid fa-check"></i>
          </div>
          <div class="brand-info">
            <h1 class="brand-title">Task Manager</h1>
            <span class="brand-sub">MCA DevOps Lab</span>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-label">VIEWS</div>
        <button class="nav-item tab-btn active" data-status="all">
          <span class="nav-left">
            <i class="fa-solid fa-inbox nav-icon"></i>
            <span>All Tasks</span>
          </span>
          <span class="count-pill" id="statTotal">0</span>
        </button>

        <button class="nav-item tab-btn" data-status="pending">
          <span class="nav-left">
            <i class="fa-regular fa-clock nav-icon"></i>
            <span>Pending</span>
          </span>
          <span class="count-pill" id="statPending">0</span>
        </button>

        <button class="nav-item tab-btn" data-status="in-progress">
          <span class="nav-left">
            <i class="fa-solid fa-arrows-rotate nav-icon"></i>
            <span>In Progress</span>
          </span>
          <span class="count-pill" id="statInProgress">0</span>
        </button>

        <button class="nav-item tab-btn" data-status="completed">
          <span class="nav-left">
            <i class="fa-regular fa-circle-check nav-icon"></i>
            <span>Completed</span>
          </span>
          <span class="count-pill" id="statCompleted">0</span>
        </button>

        <div class="nav-label" style="margin-top: 24px;">FILTER BY PRIORITY</div>
        <div class="priority-nav-list">
          <button class="prio-filter-btn active" data-prio="all">
            <span class="prio-indicator all"></span> All
          </button>
          <button class="prio-filter-btn" data-prio="urgent">
            <span class="prio-indicator urgent"></span> Urgent
          </button>
          <button class="prio-filter-btn" data-prio="high">
            <span class="prio-indicator high"></span> High
          </button>
          <button class="prio-filter-btn" data-prio="medium">
            <span class="prio-indicator medium"></span> Medium
          </button>
          <button class="prio-filter-btn" data-prio="low">
            <span class="prio-indicator low"></span> Low
          </button>
        </div>
      </nav>

      <!-- Sidebar Bottom Info -->
      <div class="sidebar-footer">
        <div id="connectionStatus" class="status-pill status-connecting" title="Backend database status">
          <span class="status-dot"></span>
          <span class="status-text">Connecting...</span>
        </div>
        <div class="tech-tag">Docker Compose &bull; MySQL 8</div>
      </div>
    </aside>

    <!-- Main Content Workspace -->
    <main class="main-content">
      
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="topbar-left">
          <h2 id="viewHeading" class="view-heading">All Tasks</h2>
          <span id="dateSubtitle" class="date-subtitle"></span>
        </div>

        <div class="topbar-right">
          <!-- Search Input -->
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search tasks (Press /)..." autocomplete="off">
            <button id="clearSearchBtn" class="clear-search-btn" style="display: none;" title="Clear search">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- Sort Dropdown -->
          <div class="select-wrapper">
            <select id="sortOrder" aria-label="Sort tasks">
              <option value="newest">Sort: Newest</option>
              <option value="oldest">Sort: Oldest</option>
              <option value="due_asc">Sort: Due date</option>
              <option value="priority">Sort: Priority</option>
            </select>
            <i class="fa-solid fa-chevron-down select-caret"></i>
          </div>

          <!-- Hidden select to keep script.js 100% compatible -->
          <select id="priorityFilter" style="display: none;">
            <option value="all">all</option>
          </select>

          <!-- Refresh Button -->
          <button id="refreshBtn" class="icon-btn" title="Refresh tasks">
            <i class="fa-solid fa-arrows-rotate"></i>
          </button>

          <!-- Theme Toggle -->
          <button id="themeToggleBtn" class="icon-btn" title="Toggle dark/light theme">
            <i class="fa-solid fa-moon"></i>
          </button>

          <!-- Modal Trigger (also available as secondary option) -->
          <button id="openNewTaskBtn" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i>
            <span>New Task</span>
          </button>
        </div>
      </header>

      <!-- Task Content Body -->
      <div class="content-body">
        
        <!-- Quick Inline Add Task Form (Human-friendly fast input!) -->
        <section class="quick-add-section">
          <form id="quickAddForm" class="quick-add-form">
            <i class="fa-solid fa-plus quick-icon"></i>
            <input type="text" id="quickTaskTitle" placeholder="Add a task (e.g. 'Submit Cloud lab assignment')... Press Enter to save" autocomplete="off" required>
            
            <div class="quick-options">
              <select id="quickTaskPriority" aria-label="Quick priority">
                <option value="medium" selected>Priority: Medium</option>
                <option value="high">Priority: High</option>
                <option value="urgent">Priority: Urgent</option>
                <option value="low">Priority: Low</option>
              </select>

              <input type="date" id="quickTaskDueDate" aria-label="Quick due date" title="Due date">
              <button type="submit" class="btn btn-sm btn-primary">Add Task</button>
            </div>
          </form>
        </section>

        <!-- Progress Summary -->
        <div class="progress-strip">
          <div class="progress-bar-container">
            <div class="progress-bar-fill" id="completionRateFill" style="width: 0%"></div>
          </div>
          <span class="stat-rate" id="completionRateText">0% completed</span>
          <span class="tasks-count-pill" id="tasksCountBadge">0 tasks</span>
        </div>

        <!-- Task List Container -->
        <div id="tasksContainer" class="tasks-container">
          <!-- Injected dynamically by script.js -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-icon"><i class="fa-regular fa-clipboard"></i></div>
          <h3>No tasks in this view</h3>
          <p id="emptyStateSubtitle">You don't have any tasks matching your filters.</p>
          <button id="emptyCreateBtn" class="btn btn-secondary">
            <i class="fa-solid fa-plus"></i> Create your first task
          </button>
        </div>

      </div>
    </main>

  </div>

  <!-- Create / Edit Task Modal -->
  <div id="taskModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 id="modalTitle">Edit Task</h3>
        <button id="closeModalBtn" class="icon-btn close-btn" aria-label="Close modal">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="taskForm" class="modal-form">
        <input type="hidden" id="taskId">

        <div class="form-group">
          <label for="taskTitle">Task Title <span class="required">*</span></label>
          <input type="text" id="taskTitle" placeholder="e.g. Prepare presentation slides" required maxlength="150">
        </div>

        <div class="form-group">
          <label for="taskDescription">Notes / Details</label>
          <textarea id="taskDescription" rows="3" placeholder="Add helpful context or subtasks..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <div class="select-wrapper">
              <select id="taskPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
              <i class="fa-solid fa-chevron-down select-caret"></i>
            </div>
          </div>

          <div class="form-group">
            <label for="taskStatus">Status</label>
            <div class="select-wrapper">
              <select id="taskStatus">
                <option value="pending" selected>Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
              </select>
              <i class="fa-solid fa-chevron-down select-caret"></i>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="taskDueDate">Due Date</label>
          <input type="date" id="taskDueDate">
        </div>

        <div class="modal-actions">
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="saveTaskBtn" class="btn btn-primary">
            <span id="saveBtnText">Save Changes</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" id="deleteModalBackdrop"></div>
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h3>Delete Task</h3>
        <button id="closeDeleteModalBtn" class="icon-btn close-btn" aria-label="Close modal">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete <strong id="deleteTaskTitle">this task</strong>?</p>
      </div>
      <div class="modal-actions">
        <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
